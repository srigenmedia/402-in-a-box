[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "srigen-mcp-402"
version = "0.1.0"
description = "402-in-a-Box Python SDK for metered MCP tools (HTTP 402 + Idempotency + 2PC Reserve/Commit/Rollback)."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/srigen_mcp_402"]

[tool.ruff]
line-length = 110
target-version = "py311"
